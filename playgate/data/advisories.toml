# Known-vulnerable dependency versions, checked offline.
#
# This is a deliberately small, curated list of widely-exploited or
# high-impact advisories — not a CVE database. Each entry names the fixed
# version(s); a dependency is flagged when its version is below the fix for
# its own release line. Add entries only with a verified advisory reference.
#
# fixed: one version per maintained line. A version is vulnerable when it is
#   below the fix sharing its major.minor (or major, if no minor-line fix
#   exists), or below the lowest fix overall.
# introduced (optional): first affected version; older versions are skipped.

version = "2026.09"

[[maven]]
package = "org.apache.logging.log4j:log4j-core"
introduced = "2.0"
fixed = ["2.3.2", "2.12.4", "2.17.1"]
severity = "critical"
id = "CVE-2021-44228"
summary = "Log4Shell — remote code execution via JNDI lookups in logged strings (also CVE-2021-45046/45105/44832)."

[[maven]]
package = "org.apache.commons:commons-text"
introduced = "1.5"
fixed = ["1.10.0"]
severity = "critical"
id = "CVE-2022-42889"
summary = "Text4Shell — StringSubstitutor script/dns/url lookups allow code execution."

